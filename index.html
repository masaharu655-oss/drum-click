<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DRUM CLICK PRO - 変拍子＆アクセント対応ステージメトロノーム</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-hover: #20242e;
    --border: #2a2f3d;
    --text: #f0f2f5;
    --muted: #8b949e;
    --accent: #00e5ff;
    --accent-glow: rgba(0, 229, 255, 0.35);
    --normal-beat: #ffffff;
    --warn: #ffbe0b;
    --danger: #ff3b30;
    --spotify: #1db954;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #14171d;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand span { color: var(--accent); }
  .header-actions { display: flex; gap: 8px; }
  .btn-sm {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-sm:active { transform: scale(0.96); }

  /* Main Layout */
  .app-container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar (Playlist / Setlist) */
  .sidebar {
    width: 280px;
    background: #12141a;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: transform 0.25s ease;
  }
  .sidebar-header {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .btn-add-song {
    background: var(--spotify);
    color: #000;
    border: none;
    padding: 5px 10px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .song-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .song-item {
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 4px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: transparent;
    border: 1px solid transparent;
  }
  .song-item:hover { background: var(--panel); }
  .song-item.active {
    background: var(--panel);
    border-color: var(--accent);
  }
  .song-info { min-width: 0; flex: 1; }
  .song-title {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .song-del {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 16px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .song-del:hover { color: var(--danger); }

  /* Stage Area (Main) */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 14px;
    gap: 12px;
  }

  /* Song Header Card */
  .song-header-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .song-title-input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--border);
    color: var(--text);
    font-size: 18px;
    font-weight: 800;
    width: 100%;
    max-width: 320px;
    padding: 2px 4px;
  }
  .song-title-input:focus { outline: none; border-bottom-color: var(--accent); }
  .pan-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .pan-btn {
    background: #101217;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .pan-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  /* Visual Monitor & Beat Lamps */
  .monitor-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .status-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .now-section-badge {
    background: rgba(0, 229, 255, 0.12);
    color: var(--accent);
    border: 1px solid rgba(0, 229, 255, 0.3);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
  }
  .bar-counter {
    font-family: monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--muted);
  }
  .bar-counter span { color: var(--text); font-size: 20px; }

  .bpm-display {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .bpm-value {
    font-size: 56px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .bpm-unit { font-size: 14px; font-weight: 700; color: var(--muted); }
  .time-sig-badge {
    font-size: 16px;
    font-weight: 800;
    color: var(--warn);
    background: rgba(255, 190, 11, 0.12);
    border: 1px solid rgba(255, 190, 11, 0.35);
    padding: 2px 10px;
    border-radius: 6px;
    margin-left: 6px;
  }

  /* Interactive Beat Lamps (Accent Editor) */
  .beat-lamps-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .beat-lamps {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 4px 0;
  }
  .lamp {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: #111318;
    border: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: transform 0.06s, background 0.06s, border-color 0.15s;
  }
  .lamp:active { transform: scale(0.92); }
  .lamp-num { font-size: 16px; font-weight: 800; line-height: 1; }
  .lamp-type { font-size: 9px; font-weight: 700; margin-top: 3px; letter-spacing: 0.03em; }

  /* Accent Level Styles */
  .lamp[data-level="2"] {
    border-color: var(--accent);
    color: var(--accent);
  }
  .lamp[data-level="1"] {
    border-color: #6b7280;
    color: var(--text);
  }
  .lamp[data-level="0"] {
    border-color: #222630;
    color: #4b5563;
    opacity: 0.55;
  }

  /* Active Flash States */
  .lamp.lit[data-level="2"] {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 22px var(--accent-glow);
    transform: scale(1.08);
  }
  .lamp.lit[data-level="1"] {
    background: var(--normal-beat);
    color: #000;
    box-shadow: 0 0 14px rgba(255,255,255,0.4);
    transform: scale(1.05);
  }
  .lamp.lit[data-level="0"] {
    border-color: #4b5563;
    opacity: 0.9;
  }

  .lamp-hint {
    font-size: 11px;
    color: var(--muted);
  }

  /* Transport Controls */
  .transport {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 420px;
  }
  .btn-play {
    flex: 2;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  .btn-play.playing {
    background: var(--danger);
    color: #fff;
  }
  .btn-count {
    flex: 1;
    background: #101217;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 14px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-count.active {
    border-color: var(--warn);
    color: var(--warn);
  }

  /* Sections Timeline */
  .sections-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }
  .sections-title { font-size: 13px; font-weight: 700; color: var(--muted); }
  .btn-add-sec {
    background: var(--panel);
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .section-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 24px;
  }
  .sec-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.15s;
  }
  .sec-card.current {
    border-color: var(--accent);
    background: #1b222c;
  }
  .sec-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sec-index {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: #101217;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .sec-card.current .sec-index {
    background: var(--accent);
    color: #000;
  }
  .sec-name-input {
    flex: 1;
    background: #101217;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    min-width: 0;
  }
  .sec-play-btn {
    background: #101217;
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .sec-del-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
  }

  .sec-params {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .param-box {
    background: #101217;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .param-label { font-size: 10px; color: var(--muted); font-weight: 700; }
  .param-input, .param-select {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    font-weight: 800;
    width: 100%;
    padding: 0;
  }
  .param-select option { background: #181b22; color: var(--text); }
  .param-input:focus, .param-select:focus { outline: none; color: var(--accent); }

  /* Mini Accent Preview Bar inside Section Card */
  .sec-accent-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 4px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .sec-accent-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .mini-dot {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #101217;
    color: var(--muted);
  }
  .mini-dot[data-level="2"] {
    background: rgba(0, 229, 255, 0.2);
    border-color: var(--accent);
    color: var(--accent);
  }
  .mini-dot[data-level="1"] {
    background: rgba(255, 255, 255, 0.1);
    border-color: #6b7280;
    color: var(--text);
  }
  .mini-dot[data-level="0"] {
    opacity: 0.4;
  }
  .sec-preset-btns {
    display: flex;
    gap: 4px;
  }
  .preset-chip {
    background: #101217;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
  }
  .preset-chip:hover { color: var(--text); border-color: var(--muted); }

  /* Mobile Drawer Toggle */
  .mobile-menu-btn { display: none; }
  @media (max-width: 768px) {
    .mobile-menu-btn { display: inline-block; }
    .sidebar {
      position: fixed;
      top: 45px;
      bottom: 0;
      left: 0;
      z-index: 50;
      transform: translateX(-100%);
      box-shadow: 4px 0 20px rgba(0,0,0,0.6);
    }
    .sidebar.open { transform: translateX(0); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <button class="btn-sm mobile-menu-btn" onclick="toggleSidebar()">☰ セトリ</button>
    DRUM CLICK <span>PRO</span>
  </div>
  <div class="header-actions">
    <button class="btn-sm" onclick="nextSong()">次の曲 ⏭</button>
  </div>
</header>

<div class="app-container">
  <!-- Playlist Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">SETLIST / 曲一覧</span>
      <button class="btn-add-song" onclick="addNewSong()">＋ 曲を追加</button>
    </div>
    <div class="song-list" id="songList"></div>
  </aside>

  <!-- Main Stage -->
  <main class="stage">
    <div class="song-header-card">
      <input type="text" class="song-title-input" id="songTitleInput" onchange="updateSongTitle(this.value)" placeholder="曲名を入力">
      <div class="pan-control">
        <span>出力:</span>
        <button class="pan-btn" id="panL" onclick="setPan(-1)">Lのみ</button>
        <button class="pan-btn active" id="panC" onclick="setPan(0)">両方</button>
        <button class="pan-btn" id="panR" onclick="setPan(1)">Rのみ</button>
      </div>
    </div>

    <!-- Visual Monitor -->
    <div class="monitor-card">
      <div class="status-row">
        <div class="now-section-badge" id="nowSectionName">Intro</div>
        <div class="bar-counter">BAR <span id="nowBar">1</span> / <span id="totalBars">4</span></div>
      </div>

      <div class="bpm-display">
        <div class="bpm-value" id="nowBpm">120</div>
        <div class="bpm-unit">BPM</div>
        <div class="time-sig-badge" id="nowTimeSig">4 / 4</div>
      </div>

      <div class="beat-lamps-wrap">
        <div class="beat-lamps" id="beatLamps"></div>
        <div class="lamp-hint">※ランプをタップでアクセント切替（強・弱・無音）</div>
      </div>

      <div class="transport">
        <button class="btn-play" id="playBtn" onclick="togglePlay()">START</button>
        <button class="btn-count active" id="countInBtn" onclick="toggleCountIn()">プリカウント: ON</button>
      </div>
    </div>

    <!-- Sections List -->
    <div class="sections-header">
      <span class="sections-title">セクション構成（拍子・BPM・アクセント）</span>
      <button class="btn-add-sec" onclick="addSection()">＋ セクション追加</button>
    </div>
    <div class="section-list" id="sectionList"></div>
  </main>
</div>

<script>
// --- Default Data ---
const defaultSongs = [
  {
    id: 'song-1',
    title: 'サンプル曲（変拍子テスト）',
    sections: [
      { name: 'Intro', bpm: 130, bars: 4, beats: 4, accents: [2, 1, 1, 1] },
      { name: 'Aメロ (2・4拍アクセント)', bpm: 130, bars: 8, beats: 4, accents: [1, 2, 1, 2] },
      { name: 'Bメロ (3/4拍子)', bpm: 130, bars: 4, beats: 3, accents: [2, 1, 1] },
      { name: 'サビ (5/4拍子 3+2)', bpm: 145, bars: 4, beats: 5, accents: [2, 1, 1, 2, 1] }
    ]
  },
  {
    id: 'song-2',
    title: '曲2 (スタンダード4/4)',
    sections: [
      { name: 'Intro', bpm: 175, bars: 4, beats: 4, accents: [2, 1, 1, 1] },
      { name: 'Verse', bpm: 175, bars: 8, beats: 4, accents: [2, 1, 1, 1] },
      { name: 'Chorus', bpm: 180, bars: 8, beats: 4, accents: [2, 1, 1, 1] }
    ]
  }
];

let songs = JSON.parse(localStorage.getItem('drum_click_songs_v2')) || defaultSongs;
let currentSongIndex = 0;

// Migrate old data if missing beats/accents
songs.forEach(s => {
  s.sections.forEach(sec => {
    if (!sec.beats) sec.beats = 4;
    if (!sec.accents || sec.accents.length !== sec.beats) {
      sec.accents = Array.from({ length: sec.beats }, (_, i) => i === 0 ? 2 : 1);
    }
  });
});

function saveSongs() {
  localStorage.setItem('drum_click_songs_v2', JSON.stringify(songs));
}

// --- Web Audio Engine ---
let audioCtx = null;
let panNode = null;
let panValue = 0;
let isPlaying = false;
let useCountIn = true;

let currentSecIdx = 0;
let currentBar = 1;
let currentBeat = 0; // 0-indexed
let isCountingIn = false;
let countInBeat = 0;
let nextNoteTime = 0;
let timerID = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    panNode = audioCtx.createStereoPanner();
    panNode.pan.value = panValue;
    panNode.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function setPan(val) {
  panValue = val;
  if (panNode) panNode.pan.value = val;
  document.getElementById('panL').classList.toggle('active', val === -1);
  document.getElementById('panC').classList.toggle('active', val === 0);
  document.getElementById('panR').classList.toggle('active', val === 1);
}

// Play Click Sound (level: 2=Accent, 1=Normal, 0=Mute)
function playClickSound(time, level) {
  if (level === 0) return; // Mute
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'triangle';
  if (level === 2) {
    osc.frequency.setValueAtTime(1600, time);
    osc.frequency.exponentialRampToValueAtTime(900, time + 0.04);
    gain.gain.setValueAtTime(0.9, time);
  } else {
    osc.frequency.setValueAtTime(950, time);
    osc.frequency.exponentialRampToValueAtTime(550, time + 0.04);
    gain.gain.setValueAtTime(0.5, time);
  }

  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

  osc.connect(gain);
  gain.connect(panNode);

  osc.start(time);
  osc.stop(time + 0.055);
}

// Visual Flash
function triggerVisualBeat(beatIndex, secObj, barNum, isCount) {
  const delay = Math.max(0, (nextNoteTime - audioCtx.currentTime) * 1000);
  setTimeout(() => {
    if (!isPlaying) return;

    document.getElementById('nowBpm').textContent = secObj.bpm;
    document.getElementById('nowTimeSig').textContent = `${secObj.beats} / 4`;

    if (isCount) {
      document.getElementById('nowSectionName').textContent = `COUNT IN (${secObj.name})`;
      document.getElementById('nowBar').textContent = '0';
      document.getElementById('totalBars').textContent = secObj.bars;
    } else {
      document.getElementById('nowSectionName').textContent = secObj.name;
      document.getElementById('nowBar').textContent = barNum;
      document.getElementById('totalBars').textContent = secObj.bars;
    }

    // Re-render beat lamps if count changed
    const lampsContainer = document.getElementById('beatLamps');
    if (lampsContainer.children.length !== secObj.beats) {
      renderBeatLamps(secObj);
    }

    Array.from(lampsContainer.children).forEach((el, idx) => {
      el.classList.toggle('lit', idx === beatIndex);
    });

    highlightActiveSectionCard(currentSecIdx);
  }, delay);
}

function scheduler() {
  const song = songs[currentSongIndex];
  if (!song || song.sections.length === 0) return;

  while (nextNoteTime < audioCtx.currentTime + 0.1) {
    const sec = song.sections[currentSecIdx];
    const secondsPerBeat = 60.0 / sec.bpm;

    if (isCountingIn) {
      const level = sec.accents[countInBeat] !== undefined ? sec.accents[countInBeat] : (countInBeat === 0 ? 2 : 1);
      playClickSound(nextNoteTime, level === 0 ? 1 : level); // Count-in always audible
      triggerVisualBeat(countInBeat, sec, 0, true);

      nextNoteTime += secondsPerBeat;
      countInBeat++;
      if (countInBeat >= sec.beats) {
        isCountingIn = false;
        currentBar = 1;
        currentBeat = 0;
      }
    } else {
      const level = sec.accents[currentBeat] !== undefined ? sec.accents[currentBeat] : 1;
      playClickSound(nextNoteTime, level);
      triggerVisualBeat(currentBeat, sec, currentBar, false);

      nextNoteTime += secondsPerBeat;
      currentBeat++;

      if (currentBeat >= sec.beats) {
        currentBeat = 0;
        currentBar++;
        if (currentBar > sec.bars) {
          currentBar = 1;
          currentSecIdx++;
          if (currentSecIdx >= song.sections.length) {
            // End of song -> Stop
            setTimeout(() => stopPlay(), Math.max(0, (nextNoteTime - audioCtx.currentTime) * 1000));
            return;
          }
        }
      }
    }
  }
  timerID = setTimeout(scheduler, 25);
}

function togglePlay() {
  if (isPlaying) {
    stopPlay();
  } else {
    startPlay(0);
  }
}

function startPlay(startSectionIndex = 0) {
  const song = songs[currentSongIndex];
  if (!song || song.sections.length === 0) return;

  initAudio();
  isPlaying = true;
  currentSecIdx = startSectionIndex;
  currentBar = 1;
  currentBeat = 0;
  isCountingIn = useCountIn;
  countInBeat = 0;
  nextNoteTime = audioCtx.currentTime + 0.05;

  const btn = document.getElementById('playBtn');
  btn.textContent = 'STOP';
  btn.classList.add('playing');

  renderBeatLamps(song.sections[currentSecIdx]);
  scheduler();
}

function stopPlay() {
  isPlaying = false;
  clearTimeout(timerID);
  const btn = document.getElementById('playBtn');
  btn.textContent = 'START';
  btn.classList.remove('playing');

  document.querySelectorAll('.lamp').forEach(el => el.classList.remove('lit'));
  highlightActiveSectionCard(-1);
}

function toggleCountIn() {
  useCountIn = !useCountIn;
  const btn = document.getElementById('countInBtn');
  btn.textContent = `プリカウント: ${useCountIn ? 'ON' : 'OFF'}`;
  btn.classList.toggle('active', useCountIn);
}

// --- UI Rendering ---
function renderAll() {
  renderSongList();
  renderCurrentSong();
}

function renderSongList() {
  const list = document.getElementById('songList');
  list.innerHTML = '';
  songs.forEach((song, idx) => {
    const div = document.createElement('div');
    div.className = `song-item ${idx === currentSongIndex ? 'active' : ''}`;
    const firstBpm = song.sections[0] ? song.sections[0].bpm : '-';
    const totalBars = song.sections.reduce((acc, s) => acc + Number(s.bars), 0);
    div.innerHTML = `
      <div class="song-info" onclick="selectSong(${idx})">
        <div class="song-title">${escapeHtml(song.title)}</div>
        <div class="song-meta">BPM ${firstBpm} ・ 全${totalBars}小節</div>
      </div>
      ${songs.length > 1 ? `<button class="song-del" onclick="deleteSong(${idx})">×</button>` : ''}
    `;
    list.appendChild(div);
  });
}

function renderCurrentSong() {
  const song = songs[currentSongIndex];
  if (!song) return;

  document.getElementById('songTitleInput').value = song.title;

  const firstSec = song.sections[0] || { name: '-', bpm: 120, bars: 4, beats: 4, accents: [2,1,1,1] };
  document.getElementById('nowSectionName').textContent = firstSec.name;
  document.getElementById('nowBpm').textContent = firstSec.bpm;
  document.getElementById('nowTimeSig').textContent = `${firstSec.beats} / 4`;
  document.getElementById('nowBar').textContent = '1';
  document.getElementById('totalBars').textContent = firstSec.bars;

  renderBeatLamps(firstSec);
  renderSections();
}

function renderBeatLamps(sec) {
  const container = document.getElementById('beatLamps');
  container.innerHTML = '';
  const labels = { 2: '強', 1: '弱', 0: '無音' };

  for (let i = 0; i < sec.beats; i++) {
    const lvl = sec.accents[i] !== undefined ? sec.accents[i] : 1;
    const lamp = document.createElement('div');
    lamp.className = 'lamp';
    lamp.dataset.level = lvl;
    lamp.innerHTML = `
      <div class="lamp-num">${i + 1}</div>
      <div class="lamp-type">${labels[lvl]}</div>
    `;
    lamp.onclick = () => {
      // Cycle: 2 -> 1 -> 0 -> 2
      const nextLvl = lvl === 2 ? 1 : (lvl === 1 ? 0 : 2);
      sec.accents[i] = nextLvl;
      saveSongs();
      renderBeatLamps(sec);
      renderSections();
    };
    container.appendChild(lamp);
  }
}

function renderSections() {
  const song = songs[currentSongIndex];
  const list = document.getElementById('sectionList');
  list.innerHTML = '';

  song.sections.forEach((sec, idx) => {
    const card = document.createElement('div');
    card.className = 'sec-card';
    card.id = `sec-card-${idx}`;

    // Build beat options (1 to 12)
    let beatOptions = '';
    for (let b = 1; b <= 12; b++) {
      beatOptions += `<option value="${b}" ${sec.beats === b ? 'selected' : ''}>${b} / 4</option>`;
    }

    // Mini accent dots HTML
    let dotsHtml = '';
    for (let b = 0; b < sec.beats; b++) {
      const lvl = sec.accents[b] !== undefined ? sec.accents[b] : 1;
      dotsHtml += `<div class="mini-dot" data-level="${lvl}" onclick="cycleSectionAccent(${idx}, ${b})">${b + 1}</div>`;
    }

    card.innerHTML = `
      <div class="sec-top">
        <div class="sec-index">${idx + 1}</div>
        <input type="text" class="sec-name-input" value="${escapeHtml(sec.name)}" onchange="updateSec(${idx}, 'name', this.value)">
        <button class="sec-play-btn" onclick="playFromSection(${idx})">▶ ここから</button>
        ${song.sections.length > 1 ? `<button class="sec-del-btn" onclick="deleteSection(${idx})">🗑</button>` : ''}
      </div>
      <div class="sec-params">
        <div class="param-box">
          <span class="param-label">BPM (テンポ)</span>
          <input type="number" class="param-input" value="${sec.bpm}" min="30" max="300" onchange="updateSec(${idx}, 'bpm', Number(this.value))">
        </div>
        <div class="param-box">
          <span class="param-label">拍子 (Beats)</span>
          <select class="param-select" onchange="updateSecBeats(${idx}, Number(this.value))">${beatOptions}</select>
        </div>
        <div class="param-box">
          <span class="param-label">小節数 (Bars)</span>
          <input type="number" class="param-input" value="${sec.bars}" min="1" max="128" onchange="updateSec(${idx}, 'bars', Number(this.value))">
        </div>
      </div>
      <div class="sec-accent-row">
        <div class="sec-accent-dots">${dotsHtml}</div>
        <div class="sec-preset-btns">
          <button class="preset-chip" onclick="applyAccentPreset(${idx}, 'head')">1拍目</button>
          <button class="preset-chip" onclick="applyAccentPreset(${idx}, 'backbeat')">2・4拍</button>
          <button class="preset-chip" onclick="applyAccentPreset(${idx}, 'flat')">均等</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

function highlightActiveSectionCard(activeIdx) {
  document.querySelectorAll('.sec-card').forEach((el, idx) => {
    el.classList.toggle('current', idx === activeIdx);
  });
}

// --- Data Actions ---
function selectSong(idx) {
  if (isPlaying) stopPlay();
  currentSongIndex = idx;
  renderAll();
  document.getElementById('sidebar').classList.remove('open');
}

function addNewSong() {
  if (isPlaying) stopPlay();
  songs.push({
    id: 'song-' + Date.now(),
    title: `新しい曲 ${songs.length + 1}`,
    sections: [
      { name: 'Intro', bpm: 120, bars: 4, beats: 4, accents: [2, 1, 1, 1] },
      { name: 'Main', bpm: 120, bars: 8, beats: 4, accents: [2, 1, 1, 1] }
    ]
  });
  currentSongIndex = songs.length - 1;
  saveSongs();
  renderAll();
}

function deleteSong(idx) {
  if (songs.length <= 1) return;
  if (!confirm('この曲を削除しますか？')) return;
  if (isPlaying) stopPlay();
  songs.splice(idx, 1);
  if (currentSongIndex >= songs.length) currentSongIndex = songs.length - 1;
  saveSongs();
  renderAll();
}

function nextSong() {
  if (isPlaying) stopPlay();
  currentSongIndex = (currentSongIndex + 1) % songs.length;
  renderAll();
}

function updateSongTitle(val) {
  songs[currentSongIndex].title = val || '無題の曲';
  saveSongs();
  renderSongList();
}

function addSection() {
  const song = songs[currentSongIndex];
  const lastSec = song.sections[song.sections.length - 1];
  const newBeats = lastSec ? lastSec.beats : 4;
  const newAccents = lastSec ? [...lastSec.accents] : [2, 1, 1, 1];
  song.sections.push({
    name: `セクション ${song.sections.length + 1}`,
    bpm: lastSec ? lastSec.bpm : 120,
    bars: 4,
    beats: newBeats,
    accents: newAccents
  });
  saveSongs();
  renderAll();
}

function deleteSection(idx) {
  const song = songs[currentSongIndex];
  if (song.sections.length <= 1) return;
  if (isPlaying) stopPlay();
  song.sections.splice(idx, 1);
  saveSongs();
  renderAll();
}

function updateSec(idx, key, val) {
  const sec = songs[currentSongIndex].sections[idx];
  sec[key] = val;
  saveSongs();
  if (idx === 0 && !isPlaying) renderCurrentSong();
  renderSongList();
}

function updateSecBeats(idx, newBeats) {
  const sec = songs[currentSongIndex].sections[idx];
  sec.beats = newBeats;
  // Resize accents array
  const nextAccents = [];
  for (let i = 0; i < newBeats; i++) {
    if (sec.accents[i] !== undefined) {
      nextAccents.push(sec.accents[i]);
    } else {
      nextAccents.push(i === 0 ? 2 : 1);
    }
  }
  sec.accents = nextAccents;
  saveSongs();
  renderAll();
}

function cycleSectionAccent(secIdx, beatIdx) {
  const sec = songs[currentSongIndex].sections[secIdx];
  const cur = sec.accents[beatIdx] !== undefined ? sec.accents[beatIdx] : 1;
  sec.accents[beatIdx] = cur === 2 ? 1 : (cur === 1 ? 0 : 2);
  saveSongs();
  renderSections();
  if (!isPlaying && secIdx === 0) renderBeatLamps(sec);
  if (isPlaying && secIdx === currentSecIdx) renderBeatLamps(sec);
}

function applyAccentPreset(secIdx, type) {
  const sec = songs[currentSongIndex].sections[secIdx];
  if (type === 'head') {
    sec.accents = Array.from({ length: sec.beats }, (_, i) => i === 0 ? 2 : 1);
  } else if (type === 'backbeat') {
    sec.accents = Array.from({ length: sec.beats }, (_, i) => (i % 2 === 1) ? 2 : 1);
  } else if (type === 'flat') {
    sec.accents = Array.from({ length: sec.beats }, () => 1);
  }
  saveSongs();
  renderSections();
  if (!isPlaying && secIdx === 0) renderBeatLamps(sec);
  if (isPlaying && secIdx === currentSecIdx) renderBeatLamps(sec);
}

function playFromSection(idx) {
  if (isPlaying) stopPlay();
  startPlay(idx);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

// Init
renderAll();
</script>
</body>
</html>
